<text x="318" y="151.0" font-size="12" fill="#0b0b0b" text-anchor="end">The governor calls a special session</text>
<text x="318" y="165.0" font-size="12" fill="#0b0b0b" text-anchor="end">on data centers by the end of 2027</text>
<g><title>The governor calls a special session that takes up data centers, by 2027-12-31.: 27% if Abbott wins, 48% if Hinojosa wins</title>
