<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="What the forecasters expect Texas to do about data centers">
<rect width="100%" height="100%" fill="#fcfcfb"/>
