<circle cx="631.0" cy="250.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="651.5" cy="250.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/></g>
<g><title>By 2027-12-31, Texas enacts a law that adds limits on building or connecting data centers.: 77% at 49.5%, 79% at 50.5%</title>
