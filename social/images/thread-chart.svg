<text x="318" y="99.0" font-size="12" fill="#0b0b0b" text-anchor="end">ERCOT resumes approving large new</text>
<text x="318" y="113.0" font-size="12" fill="#0b0b0b" text-anchor="end">data centers by mid-2027</text>
<g><title>By 2027-06-30, ERCOT resumes approving new data center Large Loads to energize.: 82% if Abbott wins, 62% if Hinojosa wins</title>
