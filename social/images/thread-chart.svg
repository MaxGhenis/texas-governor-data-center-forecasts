<text x="318" y="255.0" font-size="12" fill="#0b0b0b" text-anchor="end">Texas enacts new limits on building or</text>
<text x="318" y="269.0" font-size="12" fill="#0b0b0b" text-anchor="end">connecting data centers by the end of 2027</text>
<g><title>By 2027-12-31, Texas enacts a law that adds limits on building or connecting data centers.: 75% if Abbott wins, 80% if Hinojosa wins</title>
