<circle cx="451.6" cy="162.0" r="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><circle cx="518.2" cy="162.0" r="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/></g>
<text x="318" y="196.0" font-size="12" fill="#0b0b0b" text-anchor="end">Texas repeals or narrows its data center</text>
<text x="318" y="210.0" font-size="12" fill="#0b0b0b" text-anchor="end">sales tax breaks by the end of 2027</text>

