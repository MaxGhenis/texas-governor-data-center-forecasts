<g><title>By 2027-06-30, ERCOT resumes approving new data center Large Loads to energize.: 80% at 49.5%, 64% at 50.5%</title>
<line x1="648.3" x2="584.5" y1="110.0" y2="110.0" stroke="#52514e" stroke-width="1.5"/>
