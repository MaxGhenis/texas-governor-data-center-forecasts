<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 168" width="760" height="168" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Data center construction nationwide: probability by result">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="16" y="24" font-size="15" font-weight="600" fill="#0b0b0b">Data center construction nationwide: probability by result</text>
<circle cx="22.0" cy="46.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="32" y="50" font-size="12" fill="#0b0b0b">If Abbott wins</text>
<circle cx="132.0" cy="46.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="142" y="50" font-size="12" fill="#0b0b0b">If Hinojosa wins</text>
<circle cx="262.0" cy="46.0" r="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/>
<text x="272" y="50" font-size="12" fill="#0b0b0b">At 49.5%</text>
<circle cx="342.0" cy="46.0" r="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="352" y="50" font-size="12" fill="#0b0b0b">At 50.5%</text>
<line x1="330.0" x2="330.0" y1="68" y2="136" stroke="#e6e5e1"/>
<text x="330.0" y="154" font-size="11" fill="#52514e" text-anchor="middle">0%</text>
<line x1="430.0" x2="430.0" y1="68" y2="136" stroke="#e6e5e1"/>
<text x="430.0" y="154" font-size="11" fill="#52514e" text-anchor="middle">25%</text>
<line x1="530.0" x2="530.0" y1="68" y2="136" stroke="#e6e5e1"/>
<text x="530.0" y="154" font-size="11" fill="#52514e" text-anchor="middle">50%</text>
<line x1="630.0" x2="630.0" y1="68" y2="136" stroke="#e6e5e1"/>
<text x="630.0" y="154" font-size="11" fill="#52514e" text-anchor="middle">75%</text>
<line x1="730.0" x2="730.0" y1="68" y2="136" stroke="#e6e5e1"/>
<text x="730.0" y="154" font-size="11" fill="#52514e" text-anchor="middle">100%</text>
<text x="318" y="99.0" font-size="12" fill="#0b0b0b" text-anchor="end">A US state other than Texas enacts a statewide</text>
<text x="318" y="113.0" font-size="12" fill="#0b0b0b" text-anchor="end">moratorium on new data centers by 2027-12-31.</text>
<g><title>A US state other than Texas enacts a statewide moratorium on new data centers by 2027-12-31.: 64% if Abbott wins, 69% if Hinojosa wins</title>
<line x1="587.5" x2="605.2" y1="94.0" y2="94.0" stroke="#52514e" stroke-width="2"/>
<circle cx="587.5" cy="94.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="605.2" cy="94.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/></g>
<g><title>A US state other than Texas enacts a statewide moratorium on new data centers by 2027-12-31.: 66% at 49.5%, 67% at 50.5%</title>
<line x1="593.4" x2="599.7" y1="110.0" y2="110.0" stroke="#52514e" stroke-width="1.5"/>
<circle cx="593.4" cy="110.0" r="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><circle cx="599.7" cy="110.0" r="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/></g>
</svg>