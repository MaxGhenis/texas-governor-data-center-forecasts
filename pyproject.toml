[project]
name = "tx-gov-datacenter-forecast"
version = "0.1.0"
description = "Independent agentic conditional forecasts of what the 2026 Texas governor's race does to data center construction, pooled through a causal map"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.0", "pyyaml>=6.0", "tree-sitter>=0.25", "tree-sitter-bash>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[project.scripts]
i86 = "i86.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/i86"]

[tool.pytest.ini_options]
testpaths = ["tests"]
